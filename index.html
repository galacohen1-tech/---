<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת נוכחות - קבוצת לימון</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); position: relative; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { text-align: center; color: #2c3e50; margin: 10px 0; }
        .info-bar { display: flex; flex-direction: column; align-items: center; background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; gap: 10px; border: 1px solid #ddd; }
        #contentWrapper { opacity: 0.4; pointer-events: none; transition: 0.5s; }
        #contentWrapper.unlocked { opacity: 1; pointer-events: auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        th, td { border: 1px solid #dee2e6; padding: 10px; text-align: center; }
        th { background-color: #34495e; color: white; }
        .name-col { text-align: right; width: 220px; }
        .notes-input, .reason-select { width: 95%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .error-field { border: 2px solid #e74c3c !important; background-color: #fdf2f2; }
        .summary-box { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; margin-top: 20px; display: flex; justify-content: space-between; }
        .controls { margin-bottom: 15px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        .btn { padding: 10px 15px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; transition: 0.2s; }
        .btn-whatsapp { background-color: #25D366; }
        .btn-send { background-color: #3498db; }
        .btn-excel { background-color: #217346; }
        .btn-pdf { background-color: #c0392b; }
        .btn-reset { background-color: #95a5a6; }
        
        /* פאנל ניהול */
        #adminPanel { display: none; background: #ebf5fb; border: 2px solid #3498db; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .admin-active #adminPanel { display: block; }
        .admin-only { display: none; }
        .admin-active .admin-only { display: inline-block; }
        
        #loginModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body id="mainBody">

<div id="loginModal">
    <div class="modal-content">
        <h3>הזן קוד מנהל</h3>
        <input type="password" id="passInput" maxlength="4" style="padding:10px; font-size:1.2em; text-align:center;">
        <br><br>
        <button class="btn btn-send" onclick="checkPassword()">כניסה</button>
        <button class="btn btn-reset" onclick="closeModal()">ביטול</button>
    </div>
</div>

<div class="container">
    <div class="top-bar">
        <span style="color: #3498db; cursor: pointer;" onclick="location.reload()">🔄 רענן</span>
        <button onclick="openModal()" style="background:none; border:none; cursor:pointer;">🔒</button>
    </div>
    
    <h1>מערכת נוכחות: ט בנות - קבוצת לימון</h1>

    <div id="adminPanel">
        <h3 style="margin-top:0;">⚙️ הגדרות מנהל</h3>
        <div style="display: flex; flex-wrap: wrap; gap: 15px; align-items: center; margin-bottom: 15px;">
            <label><b>יום לימודים?</b> <input type="checkbox" id="isSchoolDay" checked onchange="saveAllData(); toggleSchoolDayMode()"></label>
            <input type="text" id="emailConfig" placeholder="מיילים להפצה..." style="padding:8px; width:250px;">
            <button class="btn btn-reset" onclick="resetTable()">🗑️ איפוס יום</button>
        </div>
        <div style="border-top: 1px solid #ccc; padding-top: 10px;">
            <b>ניהול חניכות:</b> 
            <input type="text" id="newStudentName" placeholder="שם חניכה חדשה" style="padding:6px;">
            <button class="btn btn-send" onclick="addStudent()">➕ הוסף חניכה</button>
        </div>
    </div>
    
    <div class="info-bar">
        <div>מדווח/ת: <select id="teacherSelect" onchange="updateTime(); saveAllData(); checkLocks()"><option value="">-- בחר --</option></select></div>
        <div>תאריך: <input type="date" id="reportDate" onchange="saveAllData(); checkLocks()"> <span id="displayTime"></span></div>
    </div>

    <div id="contentWrapper">
        <div class="controls">
            <button class="btn btn-whatsapp" onclick="validateAndAction(sendWhatsApp)">📱 וואטסאפ</button>
            <button class="btn btn-send" onclick="validateAndAction(sendEmail)">📧 מייל</button>
            <button class="btn btn-excel" onclick="validateAndAction(exportToExcel)">📊 אקסל</button>
            <button class="btn btn-pdf" onclick="validateAndAction(exportToPDF)">📄 PDF</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>נוכח</th>
                    <th class="name-col">שם החניך</th>
                    <th>בי"ס</th>
                    <th>סיבת היעדרות</th>
                    <th>הערות</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>

        <div class="summary-box">
            <div id="countSummary">נוכחים: 0 מתוך 0</div>
            <div id="percentSummary">אחוז: 0%</div>
        </div>
    </div>
</div>

<script>
    const ADMIN_PASSWORD = "1234";
    let students = ["פריאל וורקו איטגב", "טלאור אלמו", "נעה וובנך", "אליס לובישצ'וק", "קסם באבי", "נוי אלון", "מעיין אורקה", "יהודית טסה", "תהילה פז"];
    const teachers = ['אילנית קסתה', 'קסאו יעקב', 'שיבי דהן', 'שלומית דרסו', 'אלברט יונהייב', 'אדווה דהן', 'גאלה כהן', 'דליה אדנה'];
    let reportTime = "";

    function init() {
        const sel = document.getElementById('teacherSelect');
        teachers.sort().forEach(t => sel.add(new Option(t, t)));
        
        // טעינת רשימת חניכים מותאמת אישית אם קיימת
        const customList = localStorage.getItem('limon_student_list');
        if (customList) students = JSON.parse(customList);
        
        renderTable();
        loadSavedData();
    }

    function renderTable() {
        const tbody = document.getElementById('studentTable');
        tbody.innerHTML = "";
        students.forEach((s, i) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="checkbox" class="att-check" onchange="handleRowChange(${i}); saveAllData()"></td>
                <td class="name-col">
                    <span class="student-name">${s}</span>
                    <button class="admin-only" onclick="editStudent(${i})" style="font-size:10px; margin-right:5px;">✏️</button>
                    <button class="admin-only" onclick="deleteStudent(${i})" style="font-size:10px; color:red;">✖</button>
                </td>
                <td><input type="checkbox" class="school-check" onchange="handleRowChange(${i}); saveAllData()"></td>
                <td><select class="reason-select" onchange="handleRowChange(${i}); saveAllData()"></select></td>
                <td><input type="text" class="notes-input" oninput="saveAllData()"></td>
            `;
            tbody.appendChild(tr);
            updateDropdown(tr, true);
        });
        updateCalculations();
    }

    // פונקציות ניהול חניכים
    function addStudent() {
        const name = document.getElementById('newStudentName').value.trim();
        if (name) {
            students.push(name);
            localStorage.setItem('limon_student_list', JSON.stringify(students));
            document.getElementById('newStudentName').value = "";
            renderTable();
            saveAllData();
        }
    }

    function deleteStudent(idx) {
        if (confirm(`למחוק את ${students[idx]} מהרשימה?`)) {
            students.splice(idx, 1);
            localStorage.setItem('limon_student_list', JSON.stringify(students));
            renderTable();
            saveAllData();
        }
    }

    function editStudent(idx) {
        const newName = prompt("ערוך שם חניכה:", students[idx]);
        if (newName && newName.trim()) {
            students[idx] = newName.trim();
            localStorage.setItem('limon_student_list', JSON.stringify(students));
            renderTable();
            saveAllData();
        }
    }

    function updateTime() {
        if (!reportTime) {
            const now = new Date();
            reportTime = now.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('displayTime').innerText = "שעה: " + reportTime;
        }
    }

    function handleRowChange(idx) {
        const row = document.getElementById('studentTable').rows[idx];
        if (!row) return;
        const isP = row.querySelector('.att-check').checked;
        const sCheck = row.querySelector('.school-check');
        const isDay = document.getElementById('isSchoolDay').checked;
        
        if (!isP) {
            sCheck.checked = false; sCheck.disabled = true;
            updateDropdown(row, true);
        } else {
            sCheck.disabled = !isDay;
            updateDropdown(row, isDay ? false : true);
        }
        updateCalculations();
    }

    function updateDropdown(row, isFull) {
        const sel = row.querySelector('.reason-select');
        const current = sel.value;
        const list = isFull ? ["", "חולה", "מסרב/ת לחזור", "אירוע משפחתי", "מורחק/ת", "אחר"] : ["", "חולה", "אחר"];
        sel.innerHTML = list.map(a => `<option value="${a}">${a || '-- בחר --'}</option>`).join('');
        sel.value = current;
    }

    function saveAllData() {
        const rowsData = [];
        document.querySelectorAll('#studentTable tr').forEach(tr => {
            rowsData.push({
                name: tr.querySelector('.student-name').innerText,
                p: tr.querySelector('.att-check').checked,
                s: tr.querySelector('.school-check').checked,
                r: tr.querySelector('.reason-select').value,
                n: tr.querySelector('.notes-input').value
            });
        });
        const data = {
            teacher: document.getElementById('teacherSelect').value,
            date: document.getElementById('reportDate').value,
            time: reportTime,
            isSchoolDay: document.getElementById('isSchoolDay').checked,
            emailConfig: document.getElementById('emailConfig').value,
            rows: rowsData
        };
        localStorage.setItem('limon_report_final_v3', JSON.stringify(data));
    }

    function loadSavedData() {
        const saved = JSON.parse(localStorage.getItem('limon_report_final_v3'));
        if (!saved) return;
        document.getElementById('teacherSelect').value = saved.teacher;
        document.getElementById('reportDate').value = saved.date;
        reportTime = saved.time || "";
        if(reportTime) document.getElementById('displayTime').innerText = "שעה: " + reportTime;
        document.getElementById('isSchoolDay').checked = saved.isSchoolDay;
        document.getElementById('emailConfig').value = saved.emailConfig || "";
        
        const rows = document.querySelectorAll('#studentTable tr');
        saved.rows.forEach((rowData, i) => {
            if (rows[i]) {
                rows[i].querySelector('.att-check').checked = rowData.p;
                rows[i].querySelector('.school-check').checked = rowData.s;
                handleRowChange(i);
                rows[i].querySelector('.reason-select').value = rowData.r;
                rows[i].querySelector('.notes-input').value = rowData.n;
            }
        });
        checkLocks(); updateCalculations();
    }

    function generateMessage() {
        saveAllData();
        const saved = JSON.parse(localStorage.getItem('limon_report_final_v3'));
        const date = saved.date.split('-').reverse().join('.');
        const presentCount = saved.rows.filter(r => r.p).length;
        
        let msg = `*דיווח נוכחות: ט בנות - קבוצת לימון*\n*מדווח/ת:* ${saved.teacher}\n*תאריך:* ${date}, ${saved.time}\n\n`;
        msg += `*סיכום:* קבוצת ט בנות עם ${presentCount} מתוך ${saved.rows.length} נוכחים.\n\n`;

        let pList = `✅ *נוכחים:* \n`, aList = `❌ *חסרים:* \n`, sList = `🏫 *אי הגעה לביה"ס:* \n`;
        let hasS = false;

        saved.rows.forEach(r => {
            const info = r.r ? ` (${r.r}${r.n ? ' - ' + r.n : ''})` : "";
            if (r.p) {
                pList += `- ${r.name}\n`;
                if (saved.isSchoolDay && !r.s) { sList += `- ${r.name}${info}\n`; hasS = true; }
            } else { aList += `- ${r.name}${info}\n`; }
        });
        return msg + pList + `\n` + aList + (hasS ? `\n` + sList : "");
    }

    function sendWhatsApp() { window.open(`https://wa.me/972548685834?text=${encodeURIComponent(generateMessage())}`, '_blank'); }
    function sendEmail() { 
        const dest = document.getElementById('emailConfig').value || "Gala@kedmavillage.org.il";
        window.location.href = `mailto:${dest}?subject=נוכחות לימון&body=${encodeURIComponent(generateMessage())}`; 
    }

    function exportToExcel() {
        saveAllData();
        const saved = JSON.parse(localStorage.getItem('limon_report_final_v3'));
        let csv = "\uFEFFשם,נוכח,בי\"ס,סיבה,הערות\n";
        saved.rows.forEach(r => { csv += `${r.name},${r.p?'כן':'לא'},${r.s?'כן':'לא'},${r.r},${r.n}\n`; });
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `נוכחות_לימון_${saved.date}.csv`;
        link.click();
    }

    function exportToPDF() {
        saveAllData();
        const saved = JSON.parse(localStorage.getItem('limon_report_final_v3'));
        const element = document.createElement('div');
        // שימוש במרווחים גדולים יותר ומניעת הצמדת מילים
        element.style.padding = '40px'; 
        element.style.direction = 'rtl'; 
        element.style.fontFamily = '"Segoe UI", Arial, sans-serif';
        
        let html = `<h2 style="text-align:center; color:#2c3e50; border-bottom:2px solid #3498db; padding-bottom:10px;">דוח נוכחות: קבוצת לימון</h2>`;
        html += `<p style="font-size:14px;"><b>מדווח/ת:</b> ${saved.teacher} &nbsp; | &nbsp; <b>תאריך:</b> ${saved.date} &nbsp; | &nbsp; <b>שעה:</b> ${saved.time}</p>`;
        html += `<table border="1" style="width:100%; border-collapse:collapse; margin-top:20px;">
                    <thead><tr style="background:#f2f2f2;">
                        <th style="padding:10px;">שם החניכה</th><th style="padding:10px;">נוכח</th><th style="padding:10px;">בי"ס</th><th style="padding:10px;">סיבה והערות</th>
                    </tr></thead><tbody>`;
        
        saved.rows.forEach(r => {
            html += `<tr>
                <td style="padding:10px; text-align:right;">${r.name}</td>
                <td style="padding:10px; text-align:center;">${r.p ? 'כן' : 'לא'}</td>
                <td style="padding:10px; text-align:center;">${r.s ? 'כן' : (saved.isSchoolDay && r.p ? 'לא' : '-')}</td>
                <td style="padding:10px; text-align:right; font-size:12px;">${r.r} ${r.n ? '| ' + r.n : ''}</td>
            </tr>`;
        });
        html += `</tbody></table>`;
        element.innerHTML = html;
        
        const opt = {
            margin: 15,
            filename: `נוכחות_לימון_${saved.date}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().from(element).set(opt).save();
    }

    function validateAndAction(action) {
        let valid = true;
        document.querySelectorAll('#studentTable tr').forEach(row => {
            const isP = row.querySelector('.att-check').checked;
            const isS = row.querySelector('.school-check').checked;
            const r = row.querySelector('.reason-select');
            const n = row.querySelector('.notes-input');
            const isDay = document.getElementById('isSchoolDay').checked;
            r.classList.remove('error-field');
            if ((!isP || (isDay && isP && !isS)) && !r.value) { r.classList.add('error-field'); valid = false; }
        });
        if (valid) { saveAllData(); action(); } else alert("אנא מלא סיבת חיסור בשדות האדומים.");
    }

    function checkLocks() { if(document.getElementById('reportDate').value && document.getElementById('teacherSelect').value) document.getElementById('contentWrapper').classList.add('unlocked'); }
    function updateCalculations() {
        const p = Array.from(document.querySelectorAll('.att-check')).filter(c => c.checked).length;
        document.getElementById('countSummary').innerText = `נוכחים: ${p} מתוך ${students.length}`;
        document.getElementById('percentSummary').innerText = `אחוז: ${Math.round((p/students.length)*100)}%`;
    }
    function openModal() { document.getElementById('loginModal').style.display = 'flex'; document.getElementById('passInput').focus(); }
    function closeModal() { document.getElementById('loginModal').style.display = 'none'; document.getElementById('passInput').value = ''; }
    function checkPassword() { if(document.getElementById('passInput').value === ADMIN_PASSWORD) { document.getElementById('mainBody').classList.add('admin-active'); closeModal(); } else alert("קוד שגוי"); }
    function resetTable() { if(confirm("לאפס את כל הנתונים להיום?")) { localStorage.removeItem('limon_report_final_v3'); location.reload(); } }
    function toggleSchoolDayMode() { document.querySelectorAll('#studentTable tr').forEach((r,i) => handleRowChange(i)); }

    init();
</script>
</body>
</html>
